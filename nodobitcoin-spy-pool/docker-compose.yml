version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ${APP_NODOBITCOIN_SPY_POOL_IP}
      APP_PORT: ${APP_NODOBITCOIN_SPY_POOL_PORT}
      # Gate the dashboard behind Umbrel login — it shows queried scripthashes,
      # resolved addresses and per-entity balances.
      PROXY_AUTH_ADD: "true"

  tor:
    image: ghcr.io/getumbrel/tor:0.4.9.11@sha256:e382b8629c0dfef6ceb396b062622d4e4e955b19d6f16b883fd2c0723ad5671a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
      # App-owned volume: tor copies ONLY Spy Pool's hostname here so the app can
      # read its onion live without mounting the shared ${TOR_DATA_DIR} (which
      # holds every app's HS keys) into the app container.
      - ${APP_DATA_DIR}/onion:/onion
    environment:
      HOME: "/tmp"
    # The upstream image's entrypoint is ["tor"], so override entrypoint+command:
    # wait for Tor to create Spy Pool's hidden-service hostname, copy it into the
    # app-owned /onion volume, then exec tor. The copy runs in the background so
    # tor starts immediately; it polls until the hostname file exists, then RETRIES
    # the copy until it succeeds — the app (running as root) hands /onion to uid
    # 1000 at startup, which may land a moment after tor boots, so the copy keeps
    # retrying rather than failing once on a not-yet-writable dir. The onion then
    # appears in the dashboard on a fresh install without a restart.
    entrypoint: ["sh", "-c"]
    command:
      - '(while [ ! -s /data/app-nodobitcoin-spy-pool-electrum/hostname ]; do sleep 1; done; while ! cp -f /data/app-nodobitcoin-spy-pool-electrum/hostname /onion/hostname 2>/dev/null; do sleep 2; done) & exec tor -f /etc/tor/torrc'

  app:
    image: ghcr.io/nodobitcoin/spy-pool:v0.1.7
    init: true
    restart: on-failure
    stop_grace_period: 1m
    ports:
      # Electrum endpoint wallets opt into (instead of connecting to electrs directly).
      - "50015:50015"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Read-WRITE: the app (running as root) creates this dir and hands it to uid
      # 1000 at startup (see ensure_onion_dir) so the tor sidecar can write Spy
      # Pool's hostname into it; the app then reads it live (see TOR_HS_DIR) to
      # show the onion without a restart.
      - ${APP_DATA_DIR}/onion:/onion
    environment:
      # Upstream Electrum server. Defaults to the node's electrs; override from the
      # dashboard to point at a testnet/signet electrs — the network is auto-detected.
      ELECTRUM_HOST: ${APP_ELECTRS_NODE_IP}
      ELECTRUM_PORT: ${APP_ELECTRS_NODE_PORT}
      # Surfaced in the GUI as the node's default upstream.
      APP_ELECTRS_NODE_IP: ${APP_ELECTRS_NODE_IP}
      APP_ELECTRS_NODE_PORT: ${APP_ELECTRS_NODE_PORT}
      DB_PATH: /data/pool.db
      WEB_PORT: "4043"
      WEB_BIND: "0.0.0.0"
      PROXY_PORT: "50015"
      SPY_PUBLIC_THRESHOLD: "4"
      # Where the app reads the Electrum endpoint's onion hostname, live on every
      # request. The tor service copies Spy Pool's own hostname into this
      # app-owned volume, so the onion shows up on a fresh install without a
      # restart and without exposing other apps' Tor keys.
      TOR_HS_DIR: /onion
    networks:
      default:
        ipv4_address: ${APP_NODOBITCOIN_SPY_POOL_IP}
